spring:
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: local
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB
  jwt:
    secret: ${JWT_SECRET}
    access-exp-ms: ${JWT_EXPIRATION:3600000} # 1시간
    refresh-exp-ms: ${JWT_REFRESH_EXPIRATION:1209600000} # 14일

# Dev OAuth2 성공 후 프론트로 리다이렉트 URI (.env의 DEV_OAUTH2_REDIRECT_URI 로 덮어씌울 수 있음)
app:
  dev-oauth2:
    # 프론트 연결 전: http://localhost:8080/dev/login/callback (토큰 확인 페이지)
    # 프론트 연결 후: .env의 DEV_OAUTH2_REDIRECT_URI 에 프론트 콜백 URL 설정
    redirect-uri: ${DEV_OAUTH2_REDIRECT_URI:http://localhost:8080/dev/login/callback}

cloud:
  aws:
    credentials:
      access-key: ${AWS_ACCESS_KEY}
      secret-key: ${AWS_SECRET_KEY}
    region: ${AWS_REGION}
    s3:
      bucket: ${AWS_BUCKET}
      path:
        location: user/
server:
  port: ${PORT:8080}
  tomcat:
    max-swallow-size: -1
    max-http-form-post-size: -1

#Swagger
springdoc:
  api-docs:
    path: /v3/api-docs

  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    operations-sorter: method

---
# local profile
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${LOCAL_DB_URL}
    username: ${LOCAL_DB_USERNAME}
    password: ${LOCAL_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${LOCAL_REDIS_HOST}
      port: ${LOCAL_REDIS_PORT}
      password: ${LOCAL_REDIS_PASSWORD:}  # 비밀번호 없으면 빈 값
  sql:
    init:
      mode: never
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        use_sql_comments: true
        default_batch_fetch_size: 1000
  security:
    oauth2:
      client:
        registration:
          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            redirect-uri: "{baseUrl}/dev/login/oauth2/code/{registrationId}"
            authorization-grant-type: authorization_code
            client-name: Naver
            scope:
              - name
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

---

# develop profile
spring:
  config:
    activate:
      on-profile: develop
  datasource:
    url: ${AWS_DB_URL}
    username: ${AWS_DB_USERNAME}
    password: ${AWS_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${VALKEY_HOST}
      port: ${VALKEY_PORT}
  sql:
    init:
      mode: never
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        use_sql_comments: true
        default_batch_fetch_size: 1000

