plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.5'
	id 'io.spring.dependency-management' version '1.1.7'
}
ext {
	springAiVersion = "2.0.0-M4"
}

group = 'issueissyu'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

springBoot {
	mainClass = 'issueissyu.backend.BackendApplication'
}

tasks.named('bootJar') {
	archiveFileName = 'backend.jar'
}


repositories {
	mavenCentral()
}

dependencies {
	// spring
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'



	//lombock
	annotationProcessor 'org.projectlombok:lombok'
	compileOnly 'org.projectlombok:lombok'


	//db
	implementation 'org.postgresql:postgresql'

	//redis
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'

	//validation
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	//spring security
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.security:spring-security-config'


	//OAuth (social login)
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'

	//swagger
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.7.0'


	//aws
	//implementation 'org.springframework.cloud:spring-cloud-starter-aws:2.2.6.RELEASE' #보안이슈로 수정
	implementation platform('software.amazon.awssdk:bom:2.25.60')
	implementation 'software.amazon.awssdk:s3'
	implementation "software.amazon.awssdk:auth"
	implementation "software.amazon.awssdk:sts"

	//이미지 검증 라이브러리
	implementation 'org.apache.tika:tika-core:3.2.2'
	implementation "net.coobird:thumbnailator:0.4.20"
	implementation "com.twelvemonkeys.imageio:imageio-webp:3.10.1"
	implementation "com.twelvemonkeys.imageio:imageio-core:3.10.1"


	//env
	implementation 'io.github.cdimascio:dotenv-java:3.0.0'

	//jwt
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

	//google play billing verification
	implementation 'com.google.apis:google-api-services-androidpublisher:v3-rev20231115-2.0.0'
	implementation 'com.google.auth:google-auth-library-oauth2-http:1.23.0'
	implementation 'com.google.http-client:google-http-client-gson:1.44.1'

	// solapi (SMS 문자 인증)
	implementation 'net.nurigo:sdk:4.3.2'

	//test
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'

	// PostGIS 및 공간 데이터 처리를 위한 의존성
	implementation 'org.hibernate.orm:hibernate-spatial'

	implementation 'net.sf.geographiclib:GeographicLib-Java:2.0'

	// Firebase Admin SDK
	implementation 'com.google.firebase:firebase-admin:9.2.0'
}


tasks.named('jar') {
	enabled = false
}

// CI / 로컬: .env 의 AWS_* 로 S3 head·put·get·delete 스모크 (JUnit 아님)
tasks.register('s3Smoke', JavaExec) {
	group = 'verification'
	description = 'S3 credentials smoke; expects .env in working directory'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'issueissyu.backend.ci.S3SmokeMain'
}
