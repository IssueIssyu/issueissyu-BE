name: Issueissyu Dev CI/CD

on:
  pull_request:
    types:
      - closed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # main 브랜치로 PR이 머지되거나 수동 실행 시 작동
    if: (github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main')
      || github.event_name == 'workflow_dispatch'

    steps:
      # 코드 체크아웃
      - name: Checkout
        uses: actions/checkout@v4

      # JDK 21 설치
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Gradle 캐시
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # .env 파일 생성 (GitHub Secrets에서 주입)
      - name: Create .env file from secret
        run: |
          printf '%s' "${{ secrets.ISSUEISSYU_ENV }}" > .env
          chmod 600 .env

      # gradlew 실행 권한 부여
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 빌드 수행
      - name: Build (skip tests)
        run: ./gradlew clean build -x test

      # 현재 시간 가져오기
      - name: Get current time
        uses: josStorer/get-current-time@v2
        id: current-time
        with:
          format: 'YYYYMMDD-HHmmss'
          utcOffset: '+09:00'

      # 배포 패키지 구성 (JAR + Procfile + .env + .platform + .ebextensions — AI 쪽 rsync와 동일하게 EB 설정 포함)
      - name: Generate deployment package
        run: |
          mkdir -p deploy
          cp build/libs/backend.jar deploy/backend.jar
          cp Procfile deploy/Procfile
          cp .env deploy/.env
          cp -r .platform deploy/.platform
          cp -r .ebextensions deploy/.ebextensions
          cd deploy && zip -r deploy.zip .

      # 배포 패키지 내용 검증
      - name: Verify deploy zip content
        run: |
          unzip -l deploy/deploy.zip | head -n 50
          unzip -l deploy/deploy.zip | egrep -i "pom.xml|Buildfile|src/|repository/" && exit 1 || echo "OK"

      # 현재 배포 버전 저장 (롤백용)
      - name: Save current version
        run: |
          CURRENT=$(aws elasticbeanstalk describe-environments \
            --environment-names issueissyu-backend-dev-env-2 \
            --query 'Environments[0].VersionLabel' \
            --output text)
          echo "PREVIOUS_VERSION=$CURRENT" >> $GITHUB_ENV
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ap-northeast-2

      - name: Deploy to Elastic Beanstalk
        id: deploy
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: 'issueissyu-backend-dev'
          environment_name: 'issueissyu-backend-dev-env-2'
          region: ap-northeast-2
          version_label: github-action-${{ steps.current-time.outputs.formattedTime }}
          version_description: ${{ github.ref_name }}@${{ github.sha }}
          deployment_package: deploy/deploy.zip
          wait_for_deployment: true
          wait_for_environment_recovery: 180

      # EB 상태와 무관하게 /health 응답으로만 배포 성공 판단
      # 최대 3회 재시도, 각 시도마다 30회 health check
      - name: Smoke test with retry
        id: smoke_test
        run: |
          MAX_RETRY=3
          HEALTH_URL="http://issueissyu-backend-dev-env-2.eba-uim2fupp.ap-northeast-2.elasticbeanstalk.com/health"

          for attempt in $(seq 1 $MAX_RETRY); do
            echo "=== 스모크 테스트 시도 $attempt / $MAX_RETRY ==="
            for i in {1..30}; do
              code="$(curl -sS -o /dev/null -w '%{http_code}' $HEALTH_URL || true)"
              echo "health check $i: $code"
              if [ "$code" = "200" ]; then
                echo "health OK (시도 $attempt)"
                exit 0
              fi
              sleep 10
            done
            echo "시도 $attempt 실패"
            if [ $attempt -lt $MAX_RETRY ]; then
              echo "30초 후 재시도..."
              sleep 30
            fi
          done

          echo "최대 재시도 횟수($MAX_RETRY) 초과 - 배포 실패"
          exit 1

      # 스모크 테스트 최종 실패 시 이전 버전으로 롤백
      - name: Rollback on failure
        if: failure() && env.PREVIOUS_VERSION != '' && (steps.deploy.outcome == 'failure' || steps.smoke_test.outcome == 'failure')
        run: |
          echo "배포 실패 - ${{ env.PREVIOUS_VERSION }} 으로 롤백"
          aws elasticbeanstalk update-environment \
            --environment-name issueissyu-backend-dev-env-2 \
            --version-label ${{ env.PREVIOUS_VERSION }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ap-northeast-2