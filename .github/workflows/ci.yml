# PR / push 시 Spring Boot 백엔드 통합 CI
# 서비스 컨테이너(Postgres / Redis) → S3 smoke → bootJar → JAR 기동 후 /health 200 확인

name: IssueIssyu Backend CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # GitHub Actions 서비스 컨테이너
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 캐시 설정
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # gradlew 실행 권한 부여
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # GitHub → Settings → Secrets → CI_ENV
      - name: Create .env from secret (CI_ENV)
        run: |
          if [ -z "${{ secrets.CI_ENV }}" ]; then
            echo "Repository secret CI_ENV 가 비어 있습니다."
            exit 1
          fi
          printf '%s' "${{ secrets.CI_ENV }}" > .env
          chmod 600 .env

      # CI 서비스(Postgres/Redis) 주소로 덮어쓰기
      - name: Override datasource and Redis for CI services
        run: |
          cat >> .env << 'EOF'
          LOCAL_DB_URL=jdbc:postgresql://127.0.0.1:5432/app
          LOCAL_DB_USERNAME=postgres
          LOCAL_DB_PASSWORD=postgres
          LOCAL_REDIS_HOST=127.0.0.1
          LOCAL_REDIS_PORT=6379
          EOF

      # S3: 프로젝트의 AWS SDK v2 + dotenv-java 로 동일 스모크
      - name: Infra smoke (S3)
        run: ./gradlew s3Smoke -x test

      - name: Build bootJar (skip tests)
        run: ./gradlew clean bootJar -x test

      # 실제 JAR 기동 후 헬스체크 — RootController GET /health
      - name: Start app and verify /health
        env:
          LOCAL_DB_URL: jdbc:postgresql://127.0.0.1:5432/app
          LOCAL_DB_USERNAME: postgres
          LOCAL_DB_PASSWORD: postgres
          LOCAL_REDIS_HOST: 127.0.0.1
          LOCAL_REDIS_PORT: '6379'
        run: |
          set -euo pipefail
          LOG=/tmp/backend-boot.log
          : >"$LOG"
          java -jar build/libs/backend.jar \
            --spring.profiles.active=local \
            --spring.jpa.hibernate.ddl-auto=create-drop \
            >>"$LOG" 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true; wait "$PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if ! kill -0 "$PID" 2>/dev/null; then
              echo "Java process exited early (iteration $i)"
              break
            fi
            code="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/health || true)"
            if [ "$code" = "200" ]; then
              echo "health OK"
              exit 0
            fi
            sleep 2
          done
          echo "health check failed (last HTTP code=${code:-n/a})"
          echo "---- last 250 lines of boot log ----"
          tail -n 250 "$LOG" || true
          exit 1